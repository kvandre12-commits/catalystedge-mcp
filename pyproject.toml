[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalystedge"
version = "0.1.1"
description = "Explainable catalyst readiness and level-break evidence over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp[cli]>=1.2.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/kvandre12-commits/catalystedge-mcp"
Repository = "https://github.com/kvandre12-commits/catalystedge-mcp"
Issues = "https://github.com/kvandre12-commits/catalystedge-mcp/issues"

[project.scripts]
catalystedge-mcp = "catalystedge.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/catalystedge"]

[tool.hatch.build.targets.wheel.force-include]
"src/catalystedge/data/events.json" = "catalystedge/data/events.json"
